{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="{% static 'main/admin_login.css' %}">
</head>

<body>

    <div class="login-container">

        <p class="small-title">COLLEGE MANAGEMENT SYSTEM</p>

        <h1>Admin Login</h1>
        <p class="subtitle">Sign in to access administration</p>

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter admin username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

    </div>

</body>
</html>
