<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Teacher Login</title>
    <link rel="stylesheet" type="text/css" href="{% static '/teacher_login.css' %}">
</head>

<body>

    <div class="login-container">
        <h1>Teacher Login</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Teacher ID</label>
        <input
            type="text"
            name="teacher_id"
            placeholder="Enter your Teacher ID"
            required
        >

        <br><br>

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <br><br>

  <button type="submit" class="login-btn">
    Login
</button>
    </form>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

</body>
</html>
